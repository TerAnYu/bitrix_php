name: Build and Test

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Prepare image name (lowercase)
        id: image
        run: |
          echo "image_name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Read PHPVERSION from .env
        id: env
        run: |
          ENV_FILE=".env"
          [ ! -f "$ENV_FILE" ] && ENV_FILE=".env_example"
          PHPVERSION=$(grep '^PHPVERSION=' "$ENV_FILE" | cut -d'=' -f2)
          echo "phpversion=${PHPVERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version: ${PHPVERSION} (from ${ENV_FILE})"

      - name: Build Docker image
        run: |
          docker build -t ${{ steps.image.outputs.image_name }}:${{ steps.env.outputs.phpversion }} bin/${{ steps.env.outputs.phpversion }}

      - name: Test PHP version
        run: |
          docker run --rm ${{ steps.image.outputs.image_name }}:${{ steps.env.outputs.phpversion }} php -v | head -1

      - name: Test Apache starts
        run: |
          CONTAINER=test-${{ steps.env.outputs.phpversion }}
          docker run -d --name $CONTAINER -p 8080:80 ${{ steps.image.outputs.image_name }}:${{ steps.env.outputs.phpversion }}
          sleep 5
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080 || echo "000")
          echo "HTTP status: ${HTTP_CODE}"
          docker rm -f $CONTAINER

      - name: Test required PHP extensions
        run: |
          EXTENSIONS=$(docker run --rm ${{ steps.image.outputs.image_name }}:${{ steps.env.outputs.phpversion }} php -m)
          for ext in pdo_mysql mysqli curl zip intl mbstring gd; do
            echo "$EXTENSIONS" | grep -qi "^${ext}$" || { echo "Missing: ${ext}"; exit 1; }
          done
          echo "All required extensions present ✓"

      - name: Test composer
        run: |
          docker run --rm ${{ steps.image.outputs.image_name }}:${{ steps.env.outputs.phpversion }} composer --version

      - name: Login to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Push image to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          IMAGE_ID=${{ env.REGISTRY }}/${{ steps.image.outputs.image_name }}
          TAG=${{ steps.env.outputs.phpversion }}
          docker tag ${{ steps.image.outputs.image_name }}:${TAG} ${IMAGE_ID}:${TAG}
          docker tag ${{ steps.image.outputs.image_name }}:${TAG} ${IMAGE_ID}:latest
          docker push ${IMAGE_ID}:${TAG}
          docker push ${IMAGE_ID}:latest

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: |
            Docker image: ${{ env.REGISTRY }}/${{ steps.image.outputs.image_name }}:${{ steps.env.outputs.phpversion }}
            
            Pull with:
            ```
            docker pull ${{ env.REGISTRY }}/${{ steps.image.outputs.image_name }}:${{ steps.env.outputs.phpversion }}
            ```
          draft: false
          prerelease: false
