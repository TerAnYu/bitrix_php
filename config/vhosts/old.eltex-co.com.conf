<VirtualHost 0.0.0.0:80>
        ServerName old.eltex-co.com
        ServerAlias old.eltex-co.com www.old.eltex-co.com
        ServerAdmin webmaster@localhost

        DocumentRoot /var/www/eltex-co.com
        <Directory /var/www/eltex-co.com/ >
#                php_admin_value mbstring.func_overload 2
                AllowOverride All
                Order allow,deny
                allow from all
        </Directory>


        # Possible values include: debug, info, notice, warn, error, crit,
        # alert, emerg.
        LogLevel info

#       ErrorLog ${APACHE_LOG_DIR}/eltex-co.com-error.log
#       CustomLog ${APACHE_LOG_DIR}/eltex-co.com-access.log combined

        ErrorLog /proc/self/fd/2
        CustomLog /proc/self/fd/1 combined
</VirtualHost>
