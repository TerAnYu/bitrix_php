<VirtualHost 0.0.0.0:80>
	ServerName eltex-doma.ru
	ServerAlias www.eltex-doma.ru eltex-doma.ru dev2.eltex-doma.ru
	ServerAdmin webmaster@localhost

	DocumentRoot /var/www/eltex-doma.ru
	<Directory /var/www/eltex-doma.ru/ >
#                php_admin_value mbstring.func_overload 2
		AllowOverride All
		Order allow,deny
		allow from all
	</Directory>


	# Possible values include: debug, info, notice, warn, error, crit,
	# alert, emerg.
	LogLevel info

	ErrorLog /var/log/apache2/eltex-doma.ru-error.log
	CustomLog /var/log/apache2/eltex-doma.ru-access.log combined
</VirtualHost>
