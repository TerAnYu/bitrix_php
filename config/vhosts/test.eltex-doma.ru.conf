<VirtualHost 0.0.0.0:8080>
        ServerName http://test.eltex-doma.ru
        ServerAlias www.test.eltex-doma.ru  test.eltex-doma.ru
        ServerAdmin webmaster@localhost
        DocumentRoot /var/www/eltex-doma.ru
        <Directory /var/www/eltex-doma.ru/ >
#                php_admin_value mbstring.func_overload 2
                AllowOverride All
                Order allow,deny
                allow from all
        </Directory>


        # Possible values include: debug, info, notice, warn, error, crit,
        # alert, emerg.
        LogLevel info

#       ErrorLog ${APACHE_LOG_DIR}/eltex-doma.ru-error.log
#       CustomLog ${APACHE_LOG_DIR}/eltex-doma.ru-access.log combined

        ErrorLog /proc/self/fd/2
        CustomLog /proc/self/fd/1 combined

</VirtualHost>
